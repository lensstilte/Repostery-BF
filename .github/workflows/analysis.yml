name: Bluesky Posting Time Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  analyze:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests tzdata

      - name: Run Bluesky analysis
        run: |
          python bluesky_analysis.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-analysis-results
          path: analysis_output/
          retention-days: 30