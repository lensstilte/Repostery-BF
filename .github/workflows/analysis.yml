name: Bluesky Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests tzdata

      - name: Run
        run: python bluesky_analysis.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-results
          path: analysis_output